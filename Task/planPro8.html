<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>捕鼠器 Pro v3.3 - 智能雙模滑動分享版</title>
  
  <!-- 引入外部 CDN 圖標庫與 QR Code 庫（有網時優先） -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

  <style>
    /* CSS Reset & Apple Dark Mode Base Variables */
    :root {
      --bg-primary: #000000;
      --bg-card: #1c1c1e;
      --bg-card-secondary: #2c2c2e;
      --text-primary: #f5f5f7;
      --text-secondary: #8e8e93;
      --accent-p0: #ff453a;
      --accent-p1: #ffd60a;
      --apple-green: #30d158;
      --apple-blue: #0a84ff;
      --apple-orange: #ff9f0a;
      --apple-red: #ff453a;
      --border-color: #38383a;
      --radius-lg: 16px;
      --radius-md: 10px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    body { background-color: var(--bg-primary); color: var(--text-primary); display: flex; justify-content: center; min-height: 100vh; padding: 40px 16px; }
    .app-container { width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 24px; }

    /* Red Banner */
    .red-banner { background: rgba(255, 69, 58, 0.1); color: #ffb3b0; border: 1px solid rgba(255, 69, 58, 0.3); backdrop-filter: blur(20px); padding: 14px 20px; border-radius: var(--radius-md); display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: 500; font-size: 14px; transition: all 0.3s ease; }
    .red-banner:hover { background: rgba(255, 69, 58, 0.15); border-color: var(--accent-p0); }
    .banner-icon { display: flex; align-items: center; gap: 8px; }

    /* Cards */
    .section-card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 24px; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); }
    .section-header { display: flex; justify-content: space-between; align-items: center; }
    .section-title { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; letter-spacing: -0.3px; }

    /* Inputs */
    .task-input-box { display: flex; gap: 12px; }
    .task-input, .search-input { background-color: var(--bg-card-secondary); border: 1px solid transparent; color: var(--text-primary); padding: 14px 16px; border-radius: var(--radius-md); font-size: 15px; transition: all 0.2s; }
    .task-input { flex: 1; }
    .task-input:focus, .search-input:focus, textarea.inspiration-box:focus { outline: none; background-color: #323234; border-color: var(--apple-blue); box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.2); }

    /* Buttons */
    .btn { background-color: var(--bg-card-secondary); color: var(--text-primary); border: none; padding: 10px 16px; border-radius: var(--radius-md); cursor: pointer; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s ease; user-select: none; }
    .btn:hover { background-color: #3a3a3c; }
    .btn:active { transform: scale(0.97); }

    .btn-icon { width: 36px; height: 36px; padding: 0; border-radius: var(--radius-sm); background-color: rgba(255, 255, 255, 0.05); color: var(--text-secondary); }
    .btn-icon:hover { background-color: rgba(255, 255, 255, 0.12); color: var(--text-primary); }

    .btn-primary { background-color: var(--apple-blue); color: #fff; }
    .btn-primary:hover { background-color: #3095ff; }
    .btn-play { color: var(--apple-green); }
    .btn-play:hover { background-color: rgba(48, 209, 88, 0.15); color: var(--apple-green); }
    .btn-pause { color: var(--apple-orange); }
    .btn-pause:hover { background-color: rgba(255, 159, 10, 0.15); color: var(--apple-orange); }
    .btn-done { color: var(--apple-blue); }
    .btn-done:hover { background-color: rgba(10, 132, 255, 0.15); color: var(--apple-blue); }
    .btn-danger { color: var(--apple-red); }
    .btn-danger:hover { background-color: rgba(255, 69, 58, 0.15); color: var(--apple-red); }

    /* Task Controls */
    .task-controls { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; }
    .filter-tabs { display: flex; background-color: rgba(255, 255, 255, 0.04); padding: 4px; border-radius: var(--radius-md); }
    .filter-btn { background: none; border: none; color: var(--text-secondary); padding: 6px 16px; font-size: 13px; font-weight: 500; cursor: pointer; border-radius: 6px; transition: all 0.2s; }
    .filter-btn.active { background-color: #3a3a3c; color: var(--text-primary); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    .task-stats { font-size: 13px; color: var(--text-secondary); }

    /* Task List & Swipe Card (菜鸟滑动卡片交互) */
    .task-list { display: flex; flex-direction: column; gap: 12px; min-height: 80px; overflow: hidden; }
    .task-card-wrapper { position: relative; border-radius: var(--radius-md); overflow: hidden; background-color: var(--bg-card-secondary); border: 1px solid transparent; transition: all 0.2s; }
    .task-card-wrapper:hover { background-color: #323234; }
    .task-card-wrapper.p0 { background-color: rgba(255, 69, 58, 0.08); border-left: 4px solid var(--accent-p0); }
    .task-card-wrapper.p1 { border-left: 4px solid var(--border-color); }
    .task-card-wrapper.completed { opacity: 0.5; border-left: 4px solid #48484a; background-color: transparent; border: 1px solid var(--border-color); }
    .task-card-wrapper.completed .task-text { text-decoration: line-through; color: var(--text-secondary); }

    /* 底层隐藏的操作按钮容器 (向左滑动显示) */
    .task-actions-drawer { position: absolute; right: 0; top: 0; bottom: 0; display: flex; align-items: center; gap: 6px; padding: 0 12px; background-color: #242426; z-index: 1; }
    
    /* 上层可滑动的卡片主体 */
    .task-card-main { position: relative; background-color: inherit; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; gap: 16px; z-index: 2; transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1); touch-action: pan-y; }
    .task-card-wrapper.swiped .task-card-main { transform: translateX(-160px); }

    .task-content { display: flex; flex-direction: column; gap: 8px; flex: 1; overflow: hidden; }
    .task-header-line { display: flex; align-items: center; gap: 10px; }
    .task-text { font-size: 15px; font-weight: 500; letter-spacing: -0.2px; word-break: break-word; }

    .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; letter-spacing: 0.5px; }
    .badge-p0 { background-color: rgba(255, 69, 58, 0.2); color: var(--apple-red); border: 1px solid rgba(255, 69, 58, 0.3); }
    .badge-p1 { background-color: rgba(255, 255, 255, 0.1); color: var(--text-secondary); border: 1px solid rgba(255, 255, 255, 0.1); }

    .task-timer { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
    .time-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px; color: var(--text-primary); }
    .task-actions { display: flex; gap: 8px; align-items: center; }

    /* Pagination */
    .pagination { display: flex; justify-content: center; align-items: center; padding-top: 16px; }
    .page-controls { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--text-secondary); }

    /* Inspiration Area */
    textarea.inspiration-box { width: 100%; height: 140px; background-color: var(--bg-card-secondary); border: 1px solid transparent; color: var(--text-primary); padding: 16px; border-radius: var(--radius-md); resize: vertical; font-size: 15px; line-height: 1.6; }
    .inspiration-toolbar { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }
    .toolbar-actions { display: flex; gap: 8px; background-color: rgba(255,255,255,0.03); padding: 6px; border-radius: var(--radius-md); border: 1px solid var(--border-color); }
    .status-text { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 4px; }

    /* Share Modal 弹窗样式 */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 16px; }
    .modal-card { background: var(--bg-card); border: 1px solid var(--border-color); width: 100%; max-width: 400px; border-radius: var(--radius-lg); padding: 24px; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: 600; }
    .qrcode-box { background: #fff; padding: 16px; border-radius: var(--radius-md); display: flex; justify-content: center; align-items: center; margin: 0 auto; width: fit-content; }
    .share-link-box { display: flex; gap: 8px; }

    /* Helper Classes */
    .icon-wrapper { display: inline-flex; align-items: center; justify-content: center; }
    .spin svg { animation: spin 2s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      body { padding: 20px 12px; }
      .inspiration-toolbar { flex-direction: column; align-items: stretch; }
      .toolbar-actions { justify-content: center; }
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Top Red Banner -->
  <div id="redBanner" class="red-banner" style="display: none;" onclick="switchFilterToUnfinished()" title="點擊切換至「未完成」檢視">
    <div class="banner-icon">
      <i data-lucide="alert-circle" data-size="18"></i>
      <span>還有 <span id="unfinishedCount">0</span> 件未完成任務！</span>
    </div>
    <span style="font-size: 12px; opacity: 0.8; display: flex; align-items: center; gap: 4px;">查看待辦 <i data-lucide="chevron-right" data-size="14"></i></span>
  </div>

  <!-- TOP FOCUS AREA -->
  <div class="section-card">
    <div class="section-header">
      <div class="section-title"><i data-lucide="target" data-size="20" style="color: var(--apple-blue)"></i> 必做清單</div>
      <button class="btn btn-icon" onclick="openShareModal()" title="分享與引流"><i data-lucide="share-2" data-size="16"></i></button>
    </div>

    <div class="task-input-box">
      <input type="text" id="taskInput" class="task-input" placeholder="輸入緊急任務 (! 前綴自動標記 P0)..." onkeydown="handleTaskInputKey(event)">
      <button class="btn btn-primary" onclick="addTask()">
        <i data-lucide="plus" data-size="18"></i> 新增
      </button>
    </div>

    <div class="task-controls">
      <div class="filter-tabs">
        <button id="filterAll" class="filter-btn" onclick="setFilter('all')">全部</button>
        <button id="filterUnfinished" class="filter-btn active" onclick="setFilter('unfinished')">未完成</button>
        <button id="filterFinished" class="filter-btn" onclick="setFilter('finished')">已完成</button>
      </div>
      <div class="task-stats" id="taskStats">總數: 0 | 未完成: 0 | 已完成: 0</div>
      <button class="btn btn-icon btn-danger" style="width: auto; padding: 0 12px;" onclick="clearCompletedTasks()" title="清理已完成">
        <i data-lucide="trash-2" data-size="16"></i>
      </button>
    </div>

    <div id="taskList" class="task-list"></div>

    <div class="pagination">
      <div class="page-controls">
        <button class="btn btn-icon" onclick="changePage(-1)" title="上一頁"><i data-lucide="chevron-left" data-size="18"></i></button>
        <span id="pageIndicator" style="font-variant-numeric: tabular-nums;">1 / 1</span>
        <button class="btn btn-icon" onclick="changePage(1)" title="下一頁"><i data-lucide="chevron-right" data-size="18"></i></button>
      </div>
    </div>
  </div>

  <!-- BOTTOM BUFFER AREA -->
  <div class="section-card">
    <div class="section-header">
      <div class="section-title"><i data-lucide="lightbulb" data-size="20" style="color: var(--apple-orange)"></i> 靈感與雜念區</div>
      <span id="saveStatus" class="status-text"><i data-lucide="check-circle-2" data-size="14"></i> 每 15 秒自動儲存</span>
    </div>
    
    <textarea id="inspirationText" class="inspiration-box" placeholder="工作中突發的雜念、草稿、連結隨手倒在這裡，不打斷當前核心任務 (Ctrl+S 手動儲存)..."></textarea>
    
    <div class="inspiration-toolbar">
      <div style="position: relative; flex: 1; max-width: 300px;">
        <i data-lucide="search" data-size="16" style="position: absolute; left: 12px; top: 14px; color: var(--text-secondary);"></i>
        <input type="text" id="searchInspiration" class="search-input" style="width: 100%; padding-left: 36px;" placeholder="搜尋靈感..." oninput="handleInspirationSearch()">
      </div>
      
      <div class="toolbar-actions">
        <button class="btn btn-icon" onclick="saveInspiration()" title="手動儲存"><i data-lucide="save" data-size="16"></i></button>
        <button class="btn btn-icon" onclick="copyInspiration()" title="複製全部"><i data-lucide="copy" data-size="16"></i></button>
        <div style="width: 1px; background: var(--border-color); margin: 4px;"></div>
        <button class="btn btn-icon" onclick="exportData()" title="匯出備份"><i data-lucide="download" data-size="16"></i></button>
        <button class="btn btn-icon" onclick="triggerImport()" title="匯入備份"><i data-lucide="upload" data-size="16"></i></button>
        <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importData(event)">
        <div style="width: 1px; background: var(--border-color); margin: 4px;"></div>
        <button class="btn btn-icon btn-danger" onclick="clearInspiration()" title="清空"><i data-lucide="trash" data-size="16"></i></button>
      </div>
    </div>
    <div id="searchResultCount" class="status-text" style="display: none;"></div>
  </div>
</div>

<!-- SHARE MODAL (分享与引流弹窗) -->
<div id="shareModal" class="modal-overlay" onclick="closeShareModal(event)">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span>分享捕鼠器 Pro</span>
      <button class="btn btn-icon" onclick="closeShareModal()"><i data-lucide="x" data-size="18"></i></button>
    </div>
    <div style="font-size: 13px; color: var(--text-secondary); text-align: center;">
      掃描下方二維碼或複製連結，邀請好友一起高效管理任務！
    </div>
    <div class="qrcode-box" id="qrcodeContainer"></div>
    <div class="share-link-box">
      <input type="text" id="shareUrlInput" class="search-input" style="flex: 1; font-size: 13px;" readonly>
      <button class="btn btn-primary" onclick="copyShareUrl()">複製</button>
    </div>
    <button class="btn" style="background: var(--bg-card-secondary); width: 100%;" onclick="downloadShareCard()">
      <i data-lucide="download" data-size="16"></i> 下載引流分享卡片
    </button>
  </div>
</div>

<script>
  // ==========================================
  // 智能雙模圖標引擎 (Smart Dual-Mode Icon Engine)
  // ==========================================
  const SVG_ICONS = {
    'alert-circle': '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>',
    'chevron-right': '<polyline points="9 18 15 12 9 6"></polyline>',
    'chevron-left': '<polyline points="15 18 9 12 15 6"></polyline>',
    'target': '<circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle>',
    'plus': '<line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>',
    'trash-2': '<polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line>',
    'lightbulb': '<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.9 1.2 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path>',
    'check-circle-2': '<circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path>',
    'search': '<circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>',
    'save': '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline>',
    'copy': '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>',
    'download': '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line>',
    'upload': '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line>',
    'trash': '<path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>',
    'info': '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line>',
    'inbox': '<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path>',
    'pause': '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>',
    'play': '<polygon points="5 3 19 12 5 21 5 3"></polygon>',
    'check': '<polyline points="20 6 9 17 4 12"></polyline>',
    'tag': '<path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"></path><path d="M7 7h.01"></path>',
    'clock': '<circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline>',
    'loader': '<line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="4.93" x2="19.07" y2="7.76"></line>',
    'share-2': '<circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>',
    'x': '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>'
  };

  let isOfflineMode = false;

  function getSvgString(name, size = 16, extraClass = '') {
    const path = SVG_ICONS[name] || '';
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${extraClass}">${path}</svg>`;
  }

  function renderIcons() {
    if (typeof lucide !== 'undefined' && !isOfflineMode) {
      try {
        lucide.createIcons();
        const sample = document.querySelector('[data-lucide]');
        if (sample && sample.tagName.toLowerCase() === 'i') throw new Error("CDN fallback");
        return;
      } catch (e) { isOfflineMode = true; }
    }
    document.querySelectorAll('[data-lucide]').forEach(el => {
      const name = el.getAttribute('data-lucide');
      const size = el.getAttribute('data-size') || 16;
      if (name && SVG_ICONS[name]) {
        el.innerHTML = getSvgString(name, size);
        el.className = 'icon-wrapper';
      }
    });
  }

  // ==========================================
  // App State & Logic
  // ==========================================
  let state = {
    inspiration: '', tasks: [], filter: 'unfinished',
    currentPage: 1, pageSize: 10, timerInterval: null
  };

  window.onload = function() {
    loadData();
    renderIcons();
    initTimer();
    setInterval(autoSaveInspiration, 15000);
    
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveInspiration(); }
    });

    // 点击页面空白处收起所有左滑卡片
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.task-card-wrapper')) {
        document.querySelectorAll('.task-card-wrapper.swiped').forEach(el => el.classList.remove('swiped'));
      }
    });
  };

  function loadData() {
    const savedInspiration = localStorage.getItem('mouseTrap_inspiration');
    if (savedInspiration !== null) { state.inspiration = savedInspiration; document.getElementById('inspirationText').value = savedInspiration; }

    const savedTasks = localStorage.getItem('mouseTrap_tasks');
    if (savedTasks) {
      try {
        state.tasks = JSON.parse(savedTasks);
        state.tasks.forEach(task => {
          if (!task.status) task.status = task.completed ? 'completed' : 'pending';
          if (task.elapsedTime === undefined) task.elapsedTime = 0;
          if (task.priority === undefined) task.priority = 'P1';
        });
      } catch (e) { state.tasks = []; }
    }
    render();
  }

  function saveData() {
    localStorage.setItem('mouseTrap_inspiration', state.inspiration);
    localStorage.setItem('mouseTrap_tasks', JSON.stringify(state.tasks));
  }

  // --- Inspiration ---
  function saveInspiration() { state.inspiration = document.getElementById('inspirationText').value; saveData(); showStatus('已手動儲存'); }
  function autoSaveInspiration() {
    const current = document.getElementById('inspirationText').value;
    if (current !== state.inspiration) { state.inspiration = current; saveData(); showStatus('已自動儲存'); }
  }
  function showStatus(text) {
    const statusEl = document.getElementById('saveStatus');
    statusEl.innerHTML = `<span class="icon-wrapper" style="color: var(--apple-green)">${getSvgString('check', 14)}</span> ${text}`;
    setTimeout(() => {
      statusEl.innerHTML = `<span class="icon-wrapper">${getSvgString('check-circle-2', 14)}</span> 每 15 秒自動儲存`;
    }, 2000);
  }
  function copyInspiration() { const text = document.getElementById('inspirationText').value; navigator.clipboard.writeText(text).then(() => alert('靈感已複製！')); }
  function clearInspiration() { if (confirm('確定清空靈感區嗎？')) { document.getElementById('inspirationText').value = ''; state.inspiration = ''; saveData(); } }
  function handleInspirationSearch() {
    const query = document.getElementById('searchInspiration').value.toLowerCase();
    const text = document.getElementById('inspirationText').value;
    const countEl = document.getElementById('searchResultCount');
    if (!query) { countEl.style.display = 'none'; return; }
    const matches = (text.toLowerCase().match(new RegExp(query, 'g')) || []).length;
    countEl.style.display = 'flex';
    countEl.innerHTML = `<span class="icon-wrapper">${getSvgString('info', 14)}</span> 找到 ${matches} 處匹配`;
  }

  // --- Tasks ---
  function handleTaskInputKey(e) { if (e.key === 'Enter') addTask(); }
  function addTask() {
    const input = document.getElementById('taskInput');
    let title = input.value.trim();
    if (!title) return;
    let priority = 'P1';
    if (title.startsWith('!')) { priority = 'P0'; title = title.substring(1).trim(); }
    state.tasks.unshift({ id: Date.now().toString(), title: title, priority: priority, status: 'pending', elapsedTime: 0 });
    input.value = ''; saveData(); render();
  }
  function togglePriority(id) {
    const task = state.tasks.find(t => t.id === id);
    if (task && task.status !== 'completed') { task.priority = task.priority === 'P0' ? 'P1' : 'P0'; saveData(); render(); }
  }
  function startTask(id) {
    state.tasks.forEach(t => { if (t.id !== id && t.status === 'running') t.status = 'paused'; });
    const task = state.tasks.find(t => t.id === id);
    if (task) { task.status = 'running'; saveData(); render(); }
  }
  function pauseTask(id) { const task = state.tasks.find(t => t.id === id); if (task) { task.status = 'paused'; saveData(); render(); } }
  function completeTask(id) { const task = state.tasks.find(t => t.id === id); if (task) { task.status = 'completed'; saveData(); render(); } }
  function deleteTask(id) { if (confirm('確定刪除此任務？')) { state.tasks = state.tasks.filter(t => t.id !== id); saveData(); render(); } }
  function clearCompletedTasks() { if (confirm('確定清理已完成任務？')) { state.tasks = state.tasks.filter(t => t.status !== 'completed'); saveData(); render(); } }

  // --- Swipe Card Gesture (菜鸟卡片左右滑动核心交互) ---
  function initSwipeHandlers() {
    document.querySelectorAll('.task-card-main').forEach(cardMain => {
      let startX = 0;
      let currentTranslate = 0;
      const wrapper = cardMain.closest('.task-card-wrapper');

      cardMain.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
      }, {passive: true});

      cardMain.addEventListener('touchmove', (e) => {
        const moveX = e.touches[0].clientX;
        const diff = moveX - startX;
        if (diff < -30) {
          wrapper.classList.add('swiped');
        } else if (diff > 30) {
          wrapper.classList.remove('swiped');
        }
      }, {passive: true});

      // 鼠标支持（PC 端按住拖拽或点击切换）
      cardMain.addEventListener('click', (e) => {
        // 如果点击的是按钮本身则不触发滑动切换
        if (e.target.closest('button')) return;
        document.querySelectorAll('.task-card-wrapper.swiped').forEach(el => {
          if (el !== wrapper) el.classList.remove('swiped');
        });
        wrapper.classList.toggle('swiped');
      });
    });
  }

  // --- Timer ---
  function initTimer() {
    if (state.timerInterval) clearInterval(state.timerInterval);
    state.timerInterval = setInterval(() => {
      let active = false;
      state.tasks.forEach(t => {
        if (t.status === 'running') { t.elapsedTime = (t.elapsedTime || 0) + 1; active = true; }
      });
      if (active) updateTimerDisplays();
    }, 1000);
  }
  function updateTimerDisplays() {
    state.tasks.forEach(t => {
      if (t.status === 'running') {
        const timerEl = document.getElementById(`timer-${t.id}`);
        if (timerEl) timerEl.innerText = formatTime(t.elapsedTime);
      }
    });
  }
  function formatTime(s) {
    const m = Math.floor(s / 60).toString().padStart(2, '0');
    const sec = (s % 60).toString().padStart(2, '0');
    return `${m}:${sec}`;
  }

  // --- Views ---
  function setFilter(f) { state.filter = f; state.currentPage = 1; render(); }
  function switchFilterToUnfinished() { setFilter('unfinished'); }
  function changePage(delta) {
    const filtered = getFilteredTasks();
    const maxPage = Math.max(1, Math.ceil(filtered.length / state.pageSize));
    const newPage = state.currentPage + delta;
    if (newPage >= 1 && newPage <= maxPage) { state.currentPage = newPage; render(); }
  }
  function getFilteredTasks() {
    return state.tasks.filter(t => {
      if (state.filter === 'unfinished') return t.status !== 'completed';
      if (state.filter === 'finished') return t.status === 'completed';
      return true;
    });
  }

  // --- Render ---
  function render() {
    const unfinished = state.tasks.filter(t => t.status !== 'completed');
    const banner = document.getElementById('redBanner');
    if (unfinished.length > 0) {
      banner.style.display = 'flex';
      document.getElementById('unfinishedCount').innerText = unfinished.length;
    } else { banner.style.display = 'none'; }

    document.getElementById('filterAll').className = `filter-btn ${state.filter === 'all' ? 'active' : ''}`;
    document.getElementById('filterUnfinished').className = `filter-btn ${state.filter === 'unfinished' ? 'active' : ''}`;
    document.getElementById('filterFinished').className = `filter-btn ${state.filter === 'finished' ? 'active' : ''}`;
    document.getElementById('taskStats').innerText = `總數: ${state.tasks.length} | 未完成: ${unfinished.length} | 已完成: ${state.tasks.filter(t => t.status === 'completed').length}`;

    const filtered = getFilteredTasks();
    const maxPage = Math.max(1, Math.ceil(filtered.length / state.pageSize));
    if (state.currentPage > maxPage) state.currentPage = maxPage;

    const startIdx = (state.currentPage - 1) * state.pageSize;
    const paged = filtered.slice(startIdx, startIdx + state.pageSize);
    const list = document.getElementById('taskList');
    list.innerHTML = '';

    if (paged.length === 0) {
      list.innerHTML = `<div style="text-align: center; color: var(--text-secondary); padding: 40px 0; font-size: 14px;"><span class="icon-wrapper" style="opacity:0.5; margin-bottom:8px;" data-lucide="inbox" data-size="32"></span><br>尚無任務</div>`;
    } else {
      paged.forEach(t => {
        const isCompleted = t.status === 'completed';
        const wrapper = document.createElement('div');
        wrapper.className = `task-card-wrapper ${t.priority.toLowerCase()} ${isCompleted ? 'completed' : ''}`;

        let actionBtns = '';
        if (!isCompleted) {
          if (t.status === 'running') {
            actionBtns += `<button class="btn-icon btn-pause" onclick="pauseTask('${t.id}')" title="暫停"><i data-lucide="pause" data-size="18"></i></button>`;
          } else {
            actionBtns += `<button class="btn-icon btn-play" onclick="startTask('${t.id}')" title="開始"><i data-lucide="play" data-size="18"></i></button>`;
          }
          actionBtns += `<button class="btn-icon btn-done" onclick="completeTask('${t.id}')" title="完成"><i data-lucide="check" data-size="18"></i></button>`;
          actionBtns += `<button class="btn-icon" onclick="togglePriority('${t.id}')" title="切換優先級"><i data-lucide="tag" data-size="16"></i></button>`;
        }
        actionBtns += `<button class="btn-icon btn-danger" onclick="deleteTask('${t.id}')" title="刪除"><i data-lucide="trash-2" data-size="16"></i></button>`;

        let loadingIcon = t.status === 'running' ? `<span class="icon-wrapper spin" style="color:var(--apple-green); margin-right:4px;" data-lucide="loader" data-size="12"></span>` : '';

        wrapper.innerHTML = `
          <div class="task-actions-drawer">${actionBtns}</div>
          <div class="task-card-main">
            <div class="task-content">
              <div class="task-header-line">
                <span class="badge badge-${t.priority.toLowerCase()}">${t.priority}</span>
                <span class="task-text">${escapeHTML(t.title)}</span>
              </div>
              <div class="task-timer">
                ${loadingIcon || `<span class="icon-wrapper" data-lucide="clock" data-size="14"></span>`} 耗時 <span class="time-mono" id="timer-${t.id}">${formatTime(t.elapsedTime)}</span>
              </div>
            </div>
            <div class="task-actions" style="opacity: 0.8; font-size: 12px; color: var(--text-secondary);">👈 左滑操作</div>
          </div>
        `;
        list.appendChild(wrapper);
      });
    }

    document.getElementById('pageIndicator').innerText = `${state.currentPage} / ${maxPage}`;
    renderIcons();
    initSwipeHandlers();
  }

  // --- Share & QR Code Modal Logic ---
  function openShareModal() {
    const modal = document.getElementById('shareModal');
    const urlInput = document.getElementById('shareUrlInput');
    const currentUrl = window.location.href;
    urlInput.value = currentUrl;
    modal.style.display = 'flex';

    // 生成二维码
    const qrContainer = document.getElementById('qrcodeContainer');
    qrContainer.innerHTML = '';
    try {
      const qr = qrcode(0, 'L');
      qr.addData(currentUrl);
      qr.make();
      qrContainer.innerHTML = qr.createSvgTag({cellSize: 4, margin: 2});
    } catch (e) {
      qrContainer.innerText = '二維碼生成失敗';
    }
  }

  function closeShareModal() {
    document.getElementById('shareModal').style.display = 'none';
  }

  function copyShareUrl() {
    const urlInput = document.getElementById('shareUrlInput');
    navigator.clipboard.writeText(urlInput.value).then(() => {
      alert('分享連結已複製到剪貼簿！');
    });
  }

  function downloadShareCard() {
    alert('正在為您打包分享卡片，可直接儲存圖片引流！');
    // 简易生成 Canvas 触发下载
    const canvas = document.createElement('canvas');
    canvas.width = 600; canvas.height = 400;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#1c1c1e'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#f5f5f7'; ctx.font = 'bold 24px sans-serif';
    ctx.fillText('捕鼠器 Pro - 高效能單文件任務工具', 40, 60);
    ctx.fillStyle = '#8e8e93'; ctx.font = '16px sans-serif';
    ctx.fillText('掃描連結或訪問網址立即體驗極簡專注：', 40, 100);
    ctx.fillStyle = '#0a84ff'; ctx.fillText(window.location.href, 40, 140);
    
    const link = document.createElement('a');
    link.download = 'mousetrap_share_card.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  // --- Backup ---
  function exportData() {
    const backupData = { version: '3.3', exportDate: new Date().toISOString(), inspiration: document.getElementById('inspirationText').value, tasks: state.tasks };
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
    const a = document.createElement('a'); a.href = dataStr; a.download = `mousetrap_backup_${new Date().toISOString().slice(0,10)}.json`; a.click();
  }
  function triggerImport() { document.getElementById('importFile').click(); }
  function importData(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const imported = JSON.parse(evt.target.result);
        if (imported.inspiration !== undefined) { state.inspiration = imported.inspiration; document.getElementById('inspirationText').value = imported.inspiration; }
        if (Array.isArray(imported.tasks)) state.tasks = imported.tasks;
        saveData(); render(); alert('資料匯入成功！');
      } catch (err) { alert('檔案格式不正確'); }
    };
    reader.readAsText(file);
  }
  function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }
</script>
</body>
</html>
