<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SQL 全能工具箱 - v7</title>
    <meta name="description" content="基于本地 SQLite 驱动的轻量级工具箱导航，支持纯 SQL 增删改查与外部数据文件同步。">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide 图标库 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- sql.js (WebAssembly SQLite 引擎) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

    <!-- 顶部导航栏 -->
    <header id="headerBar" onclick="handleAdminUnlockClicks()" class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200 select-none cursor-pointer py-2.5 px-4 sm:px-6 lg:px-8">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">
            
            <!-- 标志与标题行 -->
            <div class="flex items-center justify-between pointer-events-none">
                <div class="flex items-center space-x-2.5">
                    <div class="p-1.5 bg-indigo-600 rounded-lg text-white shadow-sm shrink-0">
                        <i data-lucide="database" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <div class="flex items-center gap-1.5 flex-wrap">
                            <h1 class="text-base sm:text-lg font-bold bg-gradient-to-r from-indigo-600 to-blue-600 bg-clip-text text-transparent leading-tight">
                                SQL 全能工具箱
                            </h1>
                            <span id="adminBadge" class="hidden px-1.5 py-0.5 bg-red-100 text-red-600 text-[10px] font-bold rounded border border-red-200 whitespace-nowrap">
                                已解锁管理
                            </span>
                        </div>
                        <span id="dbStatus" class="text-[10px] text-amber-500 font-medium block">SQLite 初始化中...</span>
                    </div>
                </div>
            </div>
            
            <!-- 操作按钮组 -->
            <div class="flex items-center justify-end flex-wrap gap-1.5 sm:gap-2" onclick="event.stopPropagation()">
                <!-- 管理员模式下展示“添加工具” -->
                <button id="addToolBtn" onclick="openModal()" class="hidden items-center gap-1 px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white rounded-lg text-xs font-medium transition shadow-sm whitespace-nowrap">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i> 添加工具
                </button>
                
                <!-- 导出最新的 SQL 初始化脚本 -->
                <button id="exportSqlScriptBtn" onclick="exportSqlDumpScript()" title="导出最新 tools_init.sql 部署脚本" class="hidden p-2 text-indigo-600 hover:bg-indigo-50 rounded-lg transition shrink-0">
                    <i data-lucide="file-text" class="w-4 h-4"></i>
                </button>

                <!-- 导出二进制 SQLite 数据库 -->
                <button onclick="exportSqlDb()" title="导出 SQLite 数据库文件 (.sqlite)" class="p-2 text-slate-600 hover:bg-slate-100 rounded-lg transition shrink-0">
                    <i data-lucide="download" class="w-4 h-4"></i>
                </button>
                
                <!-- 导入文件 -->
                <label id="importBtn" title="导入 SQL / SQLite / JSON 文件" class="p-2 text-slate-600 hover:bg-slate-100 rounded-lg transition cursor-pointer shrink-0">
                    <i data-lucide="upload" class="w-4 h-4"></i>
                    <input type="file" id="importFileInput" accept=".sql,.sqlite,.db,.json,application/x-sqlite3,text/plain,*/*" class="hidden" onchange="importFile(event)">
                </label>
            </div>
        </div>
    </header>

    <!-- 主要内容区域 -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-5 space-y-6">
        
        <!-- 搜索与筛选栏 -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
            <div class="flex items-center gap-2 text-xs">
                <span class="text-slate-500 font-medium">托管工具总数：</span>
                <span id="toolCountBadge" class="px-2 py-0.5 bg-indigo-100 text-indigo-700 font-bold rounded-full">0</span>
            </div>
            
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <div class="relative flex-1 sm:w-60">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" oninput="renderTools()" placeholder="搜索工具名称或描述..." class="w-full pl-9 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <select id="typeFilter" onchange="renderTools()" class="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="ALL">所有分类</option>
                </select>
            </div>
        </div>

        <!-- 区域 1：⭐ 推荐 / 收藏工具 -->
        <section id="pinnedSection" class="space-y-3 hidden">
            <div class="flex items-center justify-between border-b border-amber-200/60 pb-2">
                <div class="flex items-center gap-1.5">
                    <span class="text-amber-500"><i data-lucide="star" class="w-4 h-4 fill-amber-400"></i></span>
                    <h2 class="text-xs sm:text-sm font-bold text-slate-800">我的收藏 / 推荐工具</h2>
                    <span id="pinnedCountBadge" class="text-[10px] px-2 py-0.5 bg-amber-100 text-amber-800 font-bold rounded-full">0</span>
                </div>
                
                <!-- 排序控制按钮 -->
                <button id="toggleSortBtn" onclick="toggleSortMode()" class="flex items-center gap-1 text-[11px] text-amber-700 hover:text-amber-900 bg-amber-50 border border-amber-200 px-2.5 py-1 rounded-md active:scale-95 transition">
                    <i data-lucide="arrow-up-down" class="w-3 h-3"></i> <span id="sortBtnText">自定义排序</span>
                </button>
            </div>
            <div id="pinnedGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3.5"></div>
        </section>

        <!-- 区域 2：所有工具 -->
        <section class="space-y-3">
            <div class="flex items-center gap-1.5 border-b border-slate-200 pb-2">
                <span class="text-indigo-600"><i data-lucide="layout-grid" class="w-4 h-4"></i></span>
                <h2 class="text-xs sm:text-sm font-bold text-slate-800">所有工具</h2>
            </div>
            <div id="toolsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3.5"></div>
        </section>

        <!-- 无数据提示 -->
        <div id="emptyState" class="hidden text-center py-12">
            <i data-lucide="folder-open" class="w-12 h-12 mx-auto text-slate-300 mb-2"></i>
            <p class="text-slate-500 font-medium text-xs">没有找到相关工具</p>
        </div>
    </main>

    <!-- 页脚 -->
    <footer onclick="handleAdminUnlockClicks()" class="bg-white border-t border-slate-200 mt-auto py-4 text-center text-xs text-slate-500 select-none cursor-pointer">
        <p>
            © <span id="copyrightYear">2026</span> SQL 全能工具箱 | 
            技术支持：<a href="https://mp.weixin.qq.com/s/uHh9gx2sUMOOjIhKyIbx4A" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" class="text-indigo-600 hover:underline font-medium">艾兜兜儿</a>
        </p>
    </footer>

    <!-- 新增 / 编辑 模态框 -->
    <div id="toolModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-100">
            <div class="flex justify-between items-center px-5 py-3.5 border-b border-slate-100 bg-slate-50">
                <h3 id="modalTitle" class="font-bold text-xs sm:text-sm text-slate-800">添加新工具</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <form id="toolForm" onsubmit="handleFormSubmit(event)" class="p-5 space-y-3 text-xs">
                <input type="hidden" id="toolId">
                
                <div>
                    <label class="block font-semibold text-slate-600 mb-1">工具名称 <span class="text-red-500">*</span></label>
                    <input type="text" id="toolName" required placeholder="例如：思维导图工具" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div>
                    <label class="block font-semibold text-slate-600 mb-1">工具地址 (URL) <span class="text-red-500">*</span></label>
                    <input type="url" id="toolUrl" required placeholder="https://..." class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">工具类型</label>
                        <input type="text" id="toolType" list="categoryDatalist" placeholder="选择或输入新类型" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                        <datalist id="categoryDatalist"></datalist>
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">图标 URL <span class="text-slate-400 font-normal">(选填)</span></label>
                        <input type="url" id="toolIcon" placeholder="留空自动识别" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block font-semibold text-slate-600 mb-1">工具描述</label>
                    <textarea id="toolDesc" rows="3" placeholder="简要描述工具的功能..." class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none resize-none"></textarea>
                </div>

                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="toolPinned" class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
                    <label for="toolPinned" class="font-medium text-slate-700">设为推荐/收藏工具 (优先排序展示)</label>
                </div>

                <div id="draftAlert" class="hidden p-2 bg-amber-50 border border-amber-200 text-amber-700 rounded text-[11px]">
                    已自动加载上次未保存的草稿内容。
                </div>

                <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-200 rounded-lg font-medium text-slate-600 hover:bg-slate-50">取消</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 访问权限控制模态框 -->
    <div id="accessModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm overflow-hidden border border-slate-100">
            <div class="flex justify-between items-center px-4 py-3 border-b border-slate-100 bg-slate-50">
                <h3 class="font-bold text-xs sm:text-sm text-slate-800 flex items-center gap-1.5">
                    <i data-lucide="shield-check" class="w-4 h-4 text-indigo-600"></i> 设置工具访问权限与锁定
                </h3>
                <button onclick="closeAccessModal()" class="text-slate-400 hover:text-slate-600 p-1"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            
            <form id="accessForm" onsubmit="handleAccessFormSubmit(event)" class="p-4 space-y-3.5 text-xs">
                <input type="hidden" id="accessToolId">

                <div>
                    <label class="block font-semibold text-slate-700 mb-1">访问控制方式</label>
                    <select id="accessType" onchange="toggleAccessFields()" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-slate-50 font-medium">
                        <option value="public">🌐 public (公开)</option>
                        <option value="hidden">🙈 hidden (隐藏)</option>
                        <option value="captcha">🔑 captcha (验证码)</option>
                        <option value="code_per_user">🎫 code_per_user (一码一发)</option>
                    </select>
                </div>

                <!-- 当类型为 captcha 时显示的验证码设置组件 -->
                <div id="captchaGroup" class="space-y-1.5 hidden bg-amber-50/50 p-2.5 rounded-lg border border-amber-200/60">
                    <label class="block font-semibold text-amber-800">自定义统一验证码</label>
                    <div class="flex gap-1.5">
                        <input type="text" id="unifiedCaptcha" placeholder="设置访问验证码..." class="flex-1 px-3 py-1.5 border border-amber-200 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none bg-white font-mono font-bold text-amber-900">
                        <button type="button" onclick="copyUnifiedCaptchaFromModal()" class="px-2.5 py-1.5 bg-amber-200/60 hover:bg-amber-200 text-amber-800 font-semibold rounded-lg transition active:scale-95 flex items-center gap-1 shrink-0">
                            <i data-lucide="copy" class="w-3.5 h-3.5"></i> 复制
                        </button>
                    </div>
                </div>

                <div class="pt-2 border-t border-slate-100">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="isLocked" class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
                        <span class="font-bold text-slate-700">锁定该工具（禁止删除）</span>
                    </label>
                    <p class="text-[11px] text-slate-400 mt-1 pl-6">防止对关键配置工具、一码一发或验证码控制的工具误操作删除。</p>
                </div>

                <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
                    <button type="button" onclick="closeAccessModal()" class="px-3.5 py-1.5 border border-slate-200 rounded-lg font-medium text-slate-600 hover:bg-slate-50">取消</button>
                    <button type="submit" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium shadow-sm">保存控制选项</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 核心 JS 逻辑 -->
    <script>
        let db = null;
        const DB_STORAGE_KEY = 'SQLITE_TOOLBOX_BYTES_V7';
        const DRAFT_STORAGE_KEY = 'TOOLBOX_FORM_DRAFT';
        const REMOTE_SQL_FILE = './tools_init.sql'; // 独立数据文件名

        let isAdminUnlocked = false;
        let isSortMode = false;
        let clickCounter = 0;
        let clickTimer = null;
        let dragSrcIndex = null;
        let currentPinnedData = [];

        function initCopyrightYear() {
            const startYear = 2026;
            const currentYear = new Date().getFullYear();
            const yearEl = document.getElementById('copyrightYear');
            if (yearEl) {
                yearEl.innerText = (currentYear > startYear) ? `${startYear}-${currentYear}` : `${startYear}`;
            }
        }

        function resolveToolIcon(name, url, userIcon) {
            if (userIcon && userIcon.trim() !== '') return userIcon.trim();

            const searchStr = (name + ' ' + url).toLowerCase();
            if (searchStr.includes('pdf')) return "https://cdn-icons-png.flaticon.com/512/337/337946.png";
            if (searchStr.includes('qr') || searchStr.includes('二维码')) return "https://cdn-icons-png.flaticon.com/512/714/714390.png";
            if (searchStr.includes('task') || searchStr.includes('plan') || searchStr.includes('任务') || searchStr.includes('计划')) return "https://cdn-icons-png.flaticon.com/512/2693/2693507.png";
            if (searchStr.includes('mind') || searchStr.includes('脑图') || searchStr.includes('思维导图')) return "https://cdn-icons-png.flaticon.com/512/1149/1149168.png";
            if (searchStr.includes('code') || searchStr.includes('代码') || searchStr.includes('run')) return "https://cdn-icons-png.flaticon.com/512/2920/2920277.png";
            if (searchStr.includes('money') || searchStr.includes('cheque') || searchStr.includes('省钱') || searchStr.includes('支票')) return "https://cdn-icons-png.flaticon.com/512/2533/2533032.png";
            if (searchStr.includes('pic') || searchStr.includes('cover') || searchStr.includes('sketch') || searchStr.includes('图片') || searchStr.includes('封面')) return "https://cdn-icons-png.flaticon.com/512/3135/3135715.png";
            if (searchStr.includes('emotion') || searchStr.includes('gif') || searchStr.includes('表情')) return "https://cdn-icons-png.flaticon.com/512/187/187150.png";
            if (searchStr.includes('game') || searchStr.includes('tetris') || searchStr.includes('star') || searchStr.includes('游戏')) return "https://cdn-icons-png.flaticon.com/512/566/566312.png";
            if (searchStr.includes('run') || searchStr.includes('running') || searchStr.includes('跑步')) return "https://cdn-icons-png.flaticon.com/512/2871/2871210.png";
            if (searchStr.includes('english') || searchStr.includes('learn') || searchStr.includes('英语')) return "https://cdn-icons-png.flaticon.com/512/3048/3048122.png";

            try {
                const domain = new URL(url).hostname;
                return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
            } catch (e) {
                return "https://cdn-icons-png.flaticon.com/512/1006/1006771.png";
            }
        }

        function handleAdminUnlockClicks() {
            clickCounter++;
            clearTimeout(clickTimer);
            clickTimer = setTimeout(() => { clickCounter = 0; }, 1500);

            if (clickCounter >= 5) {
                clickCounter = 0;
                isAdminUnlocked = !isAdminUnlocked;
                alert(isAdminUnlocked ? "🔓 已成功解锁管理功能（新增、编辑、权限控制、锁定保护、拖拽排序）" : "🔒 已锁定管理功能");
                updateAdminUI();
            }
        }

        function updateAdminUI() {
            const addBtn = document.getElementById('addToolBtn');
            const exportSqlScriptBtn = document.getElementById('exportSqlScriptBtn');
            const adminBadge = document.getElementById('adminBadge');

            if (isAdminUnlocked) {
                addBtn.classList.remove('hidden');
                addBtn.classList.add('flex');
                exportSqlScriptBtn.classList.remove('hidden');
                adminBadge.classList.remove('hidden');
            } else {
                addBtn.classList.add('hidden');
                addBtn.classList.remove('flex');
                exportSqlScriptBtn.classList.add('hidden');
                adminBadge.classList.add('hidden');
                isSortMode = false;
            }
            renderTools();
        }

        async function initSqlDb() {
            initCopyrightYear();
            try {
                const SQL = await initSqlJs({
                    locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
                });

                const savedBytes = localStorage.getItem(DB_STORAGE_KEY);
                if (savedBytes) {
                    const uInt8Array = new Uint8Array(JSON.parse(savedBytes));
                    db = new SQL.Database(uInt8Array);
                    ensureColumnsExist();
                } else {
                    db = new SQL.Database();
                    createTables();
                    await loadExternalSqlData(); // 从独立 SQL 文件加载初始化数据
                }

                document.getElementById('dbStatus').innerText = 'SQLite Engine: Ready';
                document.getElementById('dbStatus').className = 'text-[10px] text-emerald-600 font-medium block';
                
                updateCategories();
                renderTools();
                setupDraftListeners();
            } catch (err) {
                console.error(err);
                document.getElementById('dbStatus').innerText = 'SQLite 加载失败';
                document.getElementById('dbStatus').className = 'text-[10px] text-red-500 font-medium block';
            }
        }

        function createTables() {
            db.run(`
                CREATE TABLE IF NOT EXISTS tools (
                    id INTEGER PRIMARY KEY AUTOINCREMENT,
                    name TEXT NOT NULL,
                    url TEXT NOT NULL,
                    type TEXT DEFAULT '通用',
                    icon TEXT,
                    desc TEXT,
                    is_pinned INTEGER DEFAULT 0,
                    sort_order INTEGER DEFAULT 0,
                    created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
                    access_type TEXT DEFAULT 'public',
                    unified_captcha TEXT DEFAULT '',
                    is_locked INTEGER DEFAULT 0
                );
            `);
            persistSqlDb();
        }

        function ensureColumnsExist() {
            try { db.run(`ALTER TABLE tools ADD COLUMN access_type TEXT DEFAULT 'public';`); } catch (e) {}
            try { db.run(`ALTER TABLE tools ADD COLUMN unified_captcha TEXT DEFAULT '';`); } catch (e) {}
            try { db.run(`ALTER TABLE tools ADD COLUMN is_locked INTEGER DEFAULT 0;`); } catch (e) {}
        }

        async function loadExternalSqlData() {
            try {
                const response = await fetch(REMOTE_SQL_FILE);
                if (response.ok) {
                    const sqlScript = await response.text();
                    db.run(sqlScript);
                    ensureColumnsExist();
                    persistSqlDb();
                } else {
                    console.warn("未找到 tools_init.sql，采用空白数据库");
                }
            } catch (e) {
                console.warn("无法从网络获取初始化 SQL，请确保 tools_init.sql 在同一目录下", e);
            }
        }

        function persistSqlDb() {
            const data = db.export();
            localStorage.setItem(DB_STORAGE_KEY, JSON.stringify(Array.from(data)));
        }

        function toggleSortMode() {
            isSortMode = !isSortMode;
            const sortBtnText = document.getElementById('sortBtnText');
            const sortBtn = document.getElementById('toggleSortBtn');

            if (isSortMode) {
                sortBtnText.innerText = "完成排序";
                sortBtn.className = "flex items-center gap-1 text-[11px] text-white bg-indigo-600 border border-indigo-600 px-2.5 py-1 rounded-md active:scale-95 transition shadow-sm";
            } else {
                sortBtnText.innerText = "自定义排序";
                sortBtn.className = "flex items-center gap-1 text-[11px] text-amber-700 hover:text-amber-900 bg-amber-50 border border-amber-200 px-2.5 py-1 rounded-md active:scale-95 transition";
            }
            renderTools();
        }

        function renderTools() {
            if (!db) return;

            const searchKw = document.getElementById('searchInput').value.trim();
            const filterType = document.getElementById('typeFilter').value;

            let baseSql = `SELECT * FROM tools WHERE 1=1`;
            let params = [];

            // 非管理员且处于 hidden 状态的工具自动隐藏不渲染
            if (!isAdminUnlocked) {
                baseSql += ` AND (access_type IS NULL OR access_type != 'hidden')`;
            }

            if (searchKw) {
                baseSql += ` AND (name LIKE ? OR desc LIKE ?)`;
                params.push(`%${searchKw}%`, `%${searchKw}%`);
            }
            if (filterType !== 'ALL') {
                baseSql += ` AND type = ?`;
                params.push(filterType);
            }

            let pinnedSql = baseSql + ` AND is_pinned = 1 ORDER BY sort_order ASC, id DESC`;
            let normalSql = baseSql + ` AND is_pinned = 0 ORDER BY sort_order ASC, id DESC`;

            currentPinnedData = querySql(pinnedSql, params);
            const normalItems = querySql(normalSql, params);

            document.getElementById('toolCountBadge').innerText = currentPinnedData.length + normalItems.length;
            document.getElementById('pinnedCountBadge').innerText = currentPinnedData.length;

            const pinnedSection = document.getElementById('pinnedSection');
            const pinnedGrid = document.getElementById('pinnedGrid');

            if (currentPinnedData.length > 0) {
                pinnedSection.classList.remove('hidden');
                pinnedGrid.innerHTML = currentPinnedData.map((item, index) => createCardHtml(item, true, index, currentPinnedData.length)).join('');
            } else {
                pinnedSection.classList.add('hidden');
                pinnedGrid.innerHTML = '';
            }

            const toolsGrid = document.getElementById('toolsGrid');
            const emptyState = document.getElementById('emptyState');

            if (normalItems.length > 0) {
                toolsGrid.innerHTML = normalItems.map((item, index) => createCardHtml(item, false, index, normalItems.length)).join('');
            } else {
                toolsGrid.innerHTML = '';
            }

            if (currentPinnedData.length === 0 && normalItems.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
            }

            lucide.createIcons();
        }

        function querySql(sql, params) {
            const stmt = db.prepare(sql);
            stmt.bind(params);
            const list = [];
            while (stmt.step()) {
                list.push(stmt.getAsObject());
            }
            stmt.free();
            return list;
        }

        function getAccessBadgeHtml(accessType) {
            switch(accessType) {
                case 'hidden':
                    return `<span class="px-1.5 py-0.5 bg-slate-100 text-slate-600 border border-slate-200 rounded text-[10px] font-medium flex items-center gap-0.5"><i data-lucide="eye-off" class="w-3 h-3"></i>隐藏</span>`;
                case 'captcha':
                    return `<span class="px-1.5 py-0.5 bg-amber-50 text-amber-700 border border-amber-200 rounded text-[10px] font-medium flex items-center gap-0.5"><i data-lucide="key-round" class="w-3 h-3"></i>验证码</span>`;
                case 'code_per_user':
                    return `<span class="px-1.5 py-0.5 bg-purple-50 text-purple-700 border border-purple-200 rounded text-[10px] font-medium flex items-center gap-0.5"><i data-lucide="ticket" class="w-3 h-3"></i>一码一发</span>`;
                case 'public':
                default:
                    return `<span class="px-1.5 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded text-[10px] font-medium flex items-center gap-0.5"><i data-lucide="globe" class="w-3 h-3"></i>公开</span>`;
            }
        }

        function createCardHtml(item, isPinned, index, total) {
            const defaultIcon = resolveToolIcon(item.name, item.url, item.icon);
            const accessType = item.access_type || 'public';
            const isLocked = item.is_locked === 1;

            return `
            <div 
                 draggable="${isSortMode && isPinned ? 'true' : 'false'}"
                 ondragstart="handleDragStart(event, ${index})"
                 ondragover="handleDragOver(event)"
                 ondrop="handleDrop(event, ${index})"
                 onclick="${isSortMode ? 'void(0)' : `window.open('${item.url}', '_blank')`}" 
                 class="group relative bg-white rounded-xl border ${isPinned ? 'border-amber-300 ring-1 ring-amber-300/40' : 'border-slate-200'} p-3.5 hover:shadow-md active:bg-slate-50 transition cursor-pointer flex flex-col justify-between ${isSortMode && isPinned ? 'border-dashed border-indigo-400 bg-indigo-50/20' : ''}">
                
                ${isPinned ? `
                    <div class="absolute -top-2 -right-2 bg-gradient-to-r from-amber-400 to-orange-400 text-white p-1 rounded-full shadow-sm" title="推荐/已收藏工具">
                        <i data-lucide="star" class="w-3.5 h-3.5 fill-current"></i>
                    </div>
                ` : ''}

                <div>
                    <div class="flex items-start gap-2.5">
                        <img src="${defaultIcon}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1006/1006771.png'" class="w-9 h-9 rounded-lg object-cover border border-slate-100 p-0.5 shrink-0" alt="icon">
                        <div class="overflow-hidden flex-1">
                            <div class="flex items-center justify-between gap-1">
                                <h3 class="font-bold text-slate-800 group-hover:text-indigo-600 transition truncate text-xs sm:text-sm">
                                    ${escapeHtml(item.name)}
                                </h3>
                                <i data-lucide="external-link" class="w-3.5 h-3.5 text-slate-400 group-hover:text-indigo-600 shrink-0"></i>
                            </div>
                            <div class="flex items-center gap-1.5 mt-1 flex-wrap">
                                <span class="inline-block px-2 py-0.5 bg-slate-100 text-slate-500 rounded text-[10px] font-medium">
                                    ${escapeHtml(item.type || '通用')}
                                </span>
                                ${getAccessBadgeHtml(accessType)}
                                ${isLocked ? `<span class="px-1 py-0.5 bg-rose-50 text-rose-600 border border-rose-200 rounded text-[10px]" title="已锁定（禁止删除）"><i data-lucide="lock" class="w-3 h-3"></i></span>` : ''}
                            </div>
                        </div>
                    </div>
                    <p class="text-[11px] text-slate-500 mt-2 line-clamp-2 h-7 leading-relaxed">
                        ${escapeHtml(item.desc || '点击卡片直接访问此工具网页')}
                    </p>
                </div>

                ${accessType === 'captcha' && item.unified_captcha ? `
                    <div class="mt-2 p-1.5 bg-amber-50/80 border border-amber-200/60 rounded-lg flex items-center justify-between text-[11px]" onclick="event.stopPropagation()">
                        <span class="text-amber-800 font-mono truncate">验证码: <strong class="font-bold">${escapeHtml(item.unified_captcha)}</strong></span>
                        <button onclick="copyToClipboard('${escapeHtml(item.unified_captcha)}', '验证码已复制')" class="px-1.5 py-0.5 bg-amber-200/70 hover:bg-amber-200 text-amber-900 rounded font-medium text-[10px] shrink-0 active:scale-95 transition">一键复制</button>
                    </div>
                ` : ''}

                ${isSortMode && isPinned ? `
                    <div class="mt-2.5 pt-2 border-t border-indigo-100 flex items-center justify-between" onclick="event.stopPropagation()">
                        <span class="text-[10px] text-indigo-600 font-bold">可拖拽或箭头调整</span>
                        <div class="flex items-center gap-1">
                            <button onclick="movePinnedOrder(${index}, -1)" ${index === 0 ? 'disabled class="opacity-30"' : 'class="p-1 text-slate-600 hover:text-indigo-600 bg-white border border-slate-200 rounded"'} title="上移/前移"><i data-lucide="arrow-left" class="w-3.5 h-3.5"></i></button>
                            <button onclick="movePinnedOrder(${index}, 1)" ${index === total - 1 ? 'disabled class="opacity-30"' : 'class="p-1 text-slate-600 hover:text-indigo-600 bg-white border border-slate-200 rounded"'} title="下移/后移"><i data-lucide="arrow-right" class="w-3.5 h-3.5"></i></button>
                        </div>
                    </div>
                ` : `
                    <div class="mt-2.5 pt-2 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400" onclick="event.stopPropagation()">
                        <div class="flex items-center gap-1">
                            <button onclick="copyToClipboard('${escapeHtml(item.url)}', '链接已复制到剪贴板')" title="复制链接" class="p-1 text-slate-400 hover:text-indigo-600 rounded hover:bg-slate-100 transition">
                                <i data-lucide="link" class="w-3.5 h-3.5"></i>
                            </button>
                            <button onclick="togglePin(${item.id}, ${item.is_pinned})" title="${item.is_pinned ? '取消收藏' : '添加到我的收藏'}" class="flex items-center gap-0.5 text-[10px] px-1.5 py-0.5 rounded transition ${item.is_pinned ? 'bg-amber-50 text-amber-600 font-bold' : 'hover:bg-slate-100 text-slate-500'}">
                                <i data-lucide="star" class="w-3 h-3 ${item.is_pinned ? 'fill-amber-400 text-amber-500' : ''}"></i>
                                ${item.is_pinned ? '已收藏' : '收藏'}
                            </button>
                        </div>
                        
                        <div class="flex items-center gap-1">
                            ${isAdminUnlocked ? `
                                <button onclick="openAccessModal(${item.id})" title="设置访问控制与锁定" class="p-1 text-slate-400 hover:text-indigo-600 rounded hover:bg-slate-100 transition"><i data-lucide="shield" class="w-3.5 h-3.5"></i></button>
                                <button onclick="editTool(${item.id})" title="修改工具信息" class="p-1 text-slate-400 hover:text-indigo-600 rounded hover:bg-slate-100 transition"><i data-lucide="file-pen" class="w-3.5 h-3.5"></i></button>
                                ${!isLocked ? `
                                    <button onclick="deleteTool(${item.id})" title="删除" class="p-1 text-slate-400 hover:text-red-500 rounded hover:bg-slate-100 transition"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                                ` : `
                                    <span title="已锁定防止删除" class="p-1 text-slate-300 cursor-not-allowed"><i data-lucide="lock" class="w-3.5 h-3.5"></i></span>
                                `}
                            ` : ''}
                        </div>
                    </div>
                `}
            </div>
            `;
        }

        function copyToClipboard(text, successMsg = '已复制到剪贴板') {
            navigator.clipboard.writeText(text).then(() => {
                alert(successMsg);
            }).catch(err => {
                alert('复制失败，请手动选择复制');
            });
        }

        function openAccessModal(id) {
            const stmt = db.prepare(`SELECT * FROM tools WHERE id = ?`);
            stmt.bind([id]);
            if (stmt.step()) {
                const tool = stmt.getAsObject();
                document.getElementById('accessToolId').value = tool.id;
                document.getElementById('accessType').value = tool.access_type || 'public';
                document.getElementById('unifiedCaptcha').value = tool.unified_captcha || '';
                document.getElementById('isLocked').checked = tool.is_locked === 1;

                toggleAccessFields();
                document.getElementById('accessModal').classList.remove('hidden');
            }
            stmt.free();
        }

        function closeAccessModal() {
            document.getElementById('accessModal').classList.add('hidden');
        }

        function toggleAccessFields() {
            const accessType = document.getElementById('accessType').value;
            const captchaGroup = document.getElementById('captchaGroup');
            
            if (accessType === 'captcha') {
                captchaGroup.classList.remove('hidden');
            } else {
                captchaGroup.classList.add('hidden');
            }
        }

        function copyUnifiedCaptchaFromModal() {
            const captcha = document.getElementById('unifiedCaptcha').value.trim();
            if (!captcha) {
                alert("请先输入验证码内容");
                return;
            }
            copyToClipboard(captcha, "统一验证码已成功复制！");
        }

        function handleAccessFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('accessToolId').value;
            const accessType = document.getElementById('accessType').value;
            const unifiedCaptcha = document.getElementById('unifiedCaptcha').value.trim();
            const isLocked = document.getElementById('isLocked').checked ? 1 : 0;

            const stmt = db.prepare(`UPDATE tools SET access_type=?, unified_captcha=?, is_locked=? WHERE id=?`);
            stmt.run([accessType, unifiedCaptcha, isLocked, id]);
            stmt.free();

            persistSqlDb();
            renderTools();
            closeAccessModal();
        }

        function handleDragStart(e, index) {
            dragSrcIndex = index;
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDrop(e, targetIndex) {
            e.preventDefault();
            if (dragSrcIndex !== null && dragSrcIndex !== targetIndex) {
                const movedItem = currentPinnedData.splice(dragSrcIndex, 1)[0];
                currentPinnedData.splice(targetIndex, 0, movedItem);
                savePinnedOrder();
            }
        }

        function movePinnedOrder(index, direction) {
            const targetIndex = index + direction;
            if (targetIndex >= 0 && targetIndex < currentPinnedData.length) {
                const temp = currentPinnedData[index];
                currentPinnedData[index] = currentPinnedData[targetIndex];
                currentPinnedData[targetIndex] = temp;
                savePinnedOrder();
            }
        }

        function savePinnedOrder() {
            db.run("BEGIN TRANSACTION;");
            const stmt = db.prepare(`UPDATE tools SET sort_order = ? WHERE id = ?`);
            currentPinnedData.forEach((item, idx) => {
                stmt.run([idx + 1, item.id]);
            });
            stmt.free();
            db.run("COMMIT;");

            persistSqlDb();
            renderTools();
        }

        function setupDraftListeners() {
            const fields = ['toolName', 'toolUrl', 'toolType', 'toolIcon', 'toolDesc', 'toolPinned'];
            fields.forEach(fieldId => {
                const el = document.getElementById(fieldId);
                el.addEventListener('input', saveDraft);
                el.addEventListener('change', saveDraft);
            });
        }

        function saveDraft() {
            if (document.getElementById('toolId').value) return;

            const draft = {
                name: document.getElementById('toolName').value,
                url: document.getElementById('toolUrl').value,
                type: document.getElementById('toolType').value,
                icon: document.getElementById('toolIcon').value,
                desc: document.getElementById('toolDesc').value,
                isPinned: document.getElementById('toolPinned').checked
            };
            localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify(draft));
        }

        function loadDraftIfExist() {
            if (document.getElementById('toolId').value) return;

            const saved = localStorage.getItem(DRAFT_STORAGE_KEY);
            const alertBox = document.getElementById('draftAlert');
            if (saved) {
                try {
                    const draft = JSON.parse(saved);
                    let hasContent = false;
                    if (draft.name) { document.getElementById('toolName').value = draft.name; hasContent = true; }
                    if (draft.url) { document.getElementById('toolUrl').value = draft.url; hasContent = true; }
                    if (draft.type) { document.getElementById('toolType').value = draft.type; hasContent = true; }
                    if (draft.icon) { document.getElementById('toolIcon').value = draft.icon; hasContent = true; }
                    if (draft.desc) { document.getElementById('toolDesc').value = draft.desc; hasContent = true; }
                    if (draft.isPinned !== undefined) document.getElementById('toolPinned').checked = draft.isPinned;

                    if (hasContent) alertBox.classList.remove('hidden');
                    else alertBox.classList.add('hidden');
                } catch (e) {}
            } else {
                alertBox.classList.add('hidden');
            }
        }

        function clearDraft() {
            localStorage.removeItem(DRAFT_STORAGE_KEY);
            document.getElementById('draftAlert').classList.add('hidden');
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('toolId').value;
            const name = document.getElementById('toolName').value.trim();
            const url = document.getElementById('toolUrl').value.trim();
            const type = document.getElementById('toolType').value.trim() || '通用';
            const rawIcon = document.getElementById('toolIcon').value.trim();
            const desc = document.getElementById('toolDesc').value.trim();
            const isPinned = document.getElementById('toolPinned').checked ? 1 : 0;

            const finalIcon = resolveToolIcon(name, url, rawIcon);

            if (id) {
                const stmt = db.prepare(`UPDATE tools SET name=?, url=?, type=?, icon=?, desc=?, is_pinned=? WHERE id=?`);
                stmt.run([name, url, type, finalIcon, desc, isPinned, id]);
                stmt.free();
            } else {
                const stmt = db.prepare(`INSERT INTO tools (name, url, type, icon, desc, is_pinned, sort_order, created_at, access_type, unified_captcha, is_locked) VALUES (?, ?, ?, ?, ?, ?, 9999, datetime('now', 'localtime'), 'public', '', 0)`);
                stmt.run([name, url, type, finalIcon, desc, isPinned]);
                stmt.free();
                clearDraft();
            }

            persistSqlDb();
            updateCategories();
            renderTools();
            closeModal();
        }

        // 智能同步功能：导出包含增删改后续最新数据的 tools_init.sql 脚本
        function exportSqlDumpScript() {
            const allTools = querySql(`SELECT * FROM tools ORDER BY id ASC`, []);
            
            let sqlContent = `-- 初始化工具箱表结构\n`;
            sqlContent += `CREATE TABLE IF NOT EXISTS tools (\n`;
            sqlContent += `    id INTEGER PRIMARY KEY AUTOINCREMENT,\n`;
            sqlContent += `    name TEXT NOT NULL,\n`;
            sqlContent += `    url TEXT NOT NULL,\n`;
            sqlContent += `    type TEXT DEFAULT '通用',\n`;
            sqlContent += `    icon TEXT,\n`;
            sqlContent += `    desc TEXT,\n`;
            sqlContent += `    is_pinned INTEGER DEFAULT 0,\n`;
            sqlContent += `    sort_order INTEGER DEFAULT 0,\n`;
            sqlContent += `    created_at DATETIME DEFAULT CURRENT_TIMESTAMP,\n`;
            sqlContent += `    access_type VARCHAR(20) NOT NULL DEFAULT 'public',\n`;
            sqlContent += `    unified_captcha VARCHAR(50) DEFAULT '',\n`;
            sqlContent += `    is_locked TINYINT(1) NOT NULL DEFAULT 0\n`;
            sqlContent += `);\n\n`;

            sqlContent += `-- 清空旧数据\n`;
            sqlContent += `DELETE FROM tools;\n\n`;
            
            if (allTools.length > 0) {
                sqlContent += `INSERT INTO tools (id, name, url, type, icon, desc, is_pinned, sort_order, created_at, access_type, unified_captcha, is_locked) VALUES\n`;
                const values = allTools.map(t => {
                    const esc = (str) => (str || '').replace(/'/g, "''");
                    return `(${t.id}, '${esc(t.name)}', '${esc(t.url)}', '${esc(t.type)}', '${esc(t.icon)}', '${esc(t.desc)}', ${t.is_pinned}, ${t.sort_order || t.id}, '${esc(t.created_at)}', '${esc(t.access_type || 'public')}', '${esc(t.unified_captcha || '')}', ${t.is_locked || 0})`;
                }).join(',\n');
                sqlContent += values + `;\n`;
            }

            const blob = new Blob([sqlContent], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `tools_init.sql`;
            link.click();
            alert("已成功导出最新 `tools_init.sql` 脚本！");
        }

        function deleteTool(id) {
            const stmt = db.prepare(`SELECT is_locked FROM tools WHERE id = ?`);
            stmt.bind([id]);
            if (stmt.step()) {
                const tool = stmt.getAsObject();
                if (tool.is_locked === 1) {
                    alert('该工具已设定为“锁定”状态，禁止删除！');
                    stmt.free();
                    return;
                }
            }
            stmt.free();

            if (confirm(`确认删除该工具卡片吗？`)) {
                const delStmt = db.prepare(`DELETE FROM tools WHERE id = ?`);
                delStmt.run([id]);
                delStmt.free();

                persistSqlDb();
                updateCategories();
                renderTools();
            }
        }

        function togglePin(id, currentPin) {
            const newPin = currentPin ? 0 : 1;
            const stmt = db.prepare(`UPDATE tools SET is_pinned = ? WHERE id = ?`);
            stmt.run([newPin, id]);
            stmt.free();

            persistSqlDb();
            renderTools();
        }

        function editTool(id) {
            const stmt = db.prepare(`SELECT * FROM tools WHERE id = ?`);
            stmt.bind([id]);
            
            if (stmt.step()) {
                const tool = stmt.getAsObject();
                document.getElementById('modalTitle').innerText = `修改工具信息`;
                document.getElementById('toolId').value = tool.id;
                document.getElementById('toolName').value = tool.name;
                document.getElementById('toolUrl').value = tool.url;
                document.getElementById('toolType').value = tool.type || '';
                document.getElementById('toolIcon').value = tool.icon || '';
                document.getElementById('toolDesc').value = tool.desc || '';
                document.getElementById('toolPinned').checked = tool.is_pinned === 1;

                document.getElementById('draftAlert').classList.add('hidden');
                document.getElementById('toolModal').classList.remove('hidden');
            }
            stmt.free();
        }

        function updateCategories() {
            if (!db) return;
            const select = document.getElementById('typeFilter');
            const datalist = document.getElementById('categoryDatalist');
            const current = select.value;

            const res = db.exec(`SELECT DISTINCT type FROM tools WHERE type IS NOT NULL AND type != ''`);
            let types = [];
            if (res.length > 0 && res[0].values) {
                types = res[0].values.map(v => v[0]);
            }

            select.innerHTML = `<option value="ALL">所有分类</option>` + 
                types.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
            select.value = current;

            datalist.innerHTML = types.map(t => `<option value="${escapeHtml(t)}">`).join('');
        }

        function exportSqlDb() {
            const data = db.export();
            const blob = new Blob([data], { type: 'application/x-sqlite3' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `toolbox_database_${Date.now()}.sqlite`;
            link.click();
        }

        function importFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            if (file.name.endsWith('.sql')) {
                reader.onload = function(e) {
                    try {
                        db.run(e.target.result);
                        ensureColumnsExist();
                        persistSqlDb();
                        updateCategories();
                        renderTools();
                        alert('SQL 脚本数据导入成功！');
                    } catch (err) {
                        alert('SQL 脚本解析执行失败。');
                    }
                };
                reader.readAsText(file);
            } else if (file.name.endsWith('.json')) {
                reader.onload = function(e) {
                    try {
                        const jsonArr = JSON.parse(e.target.result);
                        if (Array.isArray(jsonArr)) {
                            db.run("BEGIN TRANSACTION;");
                            const stmt = db.prepare(`INSERT INTO tools (name, url, type, icon, desc, is_pinned, sort_order, created_at, access_type, unified_captcha, is_locked) VALUES (?, ?, ?, ?, ?, ?, 9999, datetime('now', 'localtime'), 'public', '', 0)`);
                            jsonArr.forEach(item => {
                                stmt.run([item.name, item.url, item.type || '通用', item.icon || '', item.desc || '', item.isPinned || item.is_pinned ? 1 : 0]);
                            });
                            stmt.free();
                            db.run("COMMIT;");

                            persistSqlDb();
                            updateCategories();
                            renderTools();
                            alert('JSON 数据导入成功！');
                        }
                    } catch (err) {
                        alert('JSON 格式有误。');
                    }
                };
                reader.readAsText(file);
            } else {
                reader.onload = function(e) {
                    try {
                        const uInt8Array = new Uint8Array(e.target.result);
                        db = new SQL.Database(uInt8Array);
                        ensureColumnsExist();
                        persistSqlDb();
                        updateCategories();
                        renderTools();
                        alert('SQLite 数据库文件导入成功！');
                    } catch (err) {
                        alert('SQLite 文件读取错误。');
                    }
                };
                reader.readAsArrayBuffer(file);
            }
        }

        function openModal() {
            document.getElementById('modalTitle').innerText = '添加新工具';
            document.getElementById('toolForm').reset();
            document.getElementById('toolId').value = '';
            document.getElementById('toolModal').classList.remove('hidden');
            loadDraftIfExist();
        }

        function closeModal() {
            document.getElementById('toolModal').classList.add('hidden');
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        document.addEventListener('DOMContentLoaded', initSqlDb);
    </script>
</body>
